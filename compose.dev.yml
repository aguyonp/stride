# Local build instead of the published image:
#   docker compose -f compose.yml -f compose.dev.yml up -d --build
services:
  stride:
    image: stride:local
    build:
      context: .
      args:
        VERSION: ${STRIDE_BUILD_VERSION:-local}
        COMMIT: ${STRIDE_COMMIT:-}
        BUILD_DATE: ${STRIDE_BUILD_DATE:-}
