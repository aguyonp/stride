services:
  stride:
    build:
      context: .
      args:
        VERSION: ${STRIDE_VERSION:-1.0.0}
    image: stride:${STRIDE_VERSION:-1.0.0}
    container_name: stride
    env_file: .env
    environment:
      # forcés pour rester cohérents avec l'image (un PORT/DATA_DIR du .env local ne doit pas casser le mapping)
      PORT: "8080"
      DATA_DIR: /data
    # Linux : ./data doit appartenir à cet UID/GID (make docker-up le règle sur l'utilisateur courant)
    user: "${STRIDE_UID:-65532}:${STRIDE_GID:-65532}"
    volumes:
      - ./data:/data
    ports:
      - "${STRIDE_BIND:-127.0.0.1}:${STRIDE_PORT:-8080}:8080"
    restart: unless-stopped
    # healthcheck hérité de l'image (HEALTHCHECK → /app/stride healthcheck)
