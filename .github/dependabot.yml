version: 2
updates:
  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Go backend updates
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # React frontend updates (Vite / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
