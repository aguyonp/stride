services:
  patella:
    build:
      context: .
      args:
        VERSION: ${PATELLA_VERSION:-1.0.0}
    image: patella:${PATELLA_VERSION:-1.0.0}
    container_name: patella
    env_file: .env
    environment:
      # forcés pour rester cohérents avec l'image (un PORT/DATA_DIR du .env local ne doit pas casser le mapping)
      PORT: "8080"
      DATA_DIR: /data
    # Linux : ./data doit appartenir à cet UID/GID (make docker-up le règle sur l'utilisateur courant)
    user: "${PATELLA_UID:-65532}:${PATELLA_GID:-65532}"
    volumes:
      - ./data:/data
    ports:
      - "${PATELLA_BIND:-127.0.0.1}:${PATELLA_PORT:-8080}:8080"
    restart: unless-stopped
    # healthcheck hérité de l'image (HEALTHCHECK → /app/patella healthcheck)
